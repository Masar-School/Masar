  assignments: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h10a2.5 2.5 0 0 1 2.5 2.5v14H8.5A2.5 2.5 0 0 1 6 17.5z"/><path d="M9.5 8.5h6M9.5 12h6"/></svg>',
  attendance: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  more: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>',
};

// ---------- آخر المستجدات ----------
let calSelectedDay = "";
function evTs(v) {
  if (v instanceof Date) return v.getTime();
  const s = String(v || "").trim();
  if (!s) return 0;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], 12).getTime();
  const t = new Date(s).getTime();
  return isNaN(t) ? 0 : t;
}
function cleanSubject(s) { return String(s || "").replace(/[^\u0600-\u06FF\sa-zA-Z0-9]/g, "").trim() || "مادة"; }
function relDayLabel(ts) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(ts); b.setHours(0, 0, 0, 0);
  const n = Math.round((a - b) / 86400000);
  if (n <= 0) return "اليوم";
  if (n === 1) return "أمس";
  if (n === 2) return "قبل يومين";
  if (n <= 10) return `قبل ${n} أيام`;
  return `قبل ${n} يوماً`;
}
function buildTimeline() {
  const now = Date.now(), WIN = 30 * 86400000, kids = session.children || [];
  const ev = [];
  const push = (ts, icon, text, tone) => { if (ts && now - ts <= WIN && ts <= now + 86400000) ev.push({ ts, icon, text, tone }); };
  kids.forEach((c) => {
    const fn = esc(firstName(c.Student_Name)), sid = String(c.Student_ID).trim();
    (session.attendance || []).forEach((a) => {
      if (String(a.Student_ID).trim() !== sid) return;
      const st = String(a.Status || "");
      const absent = /غائب|غياب/.test(st), late = /متأخر|تأخير/.test(st);
      if (absent || late) push(evTs(a.Date), absent ? "📍" : "⏰", `${absent ? "غياب" : "تأخر"} ${fn}`, absent ? "bad" : "warn");
    });
    childGradeRows(c).forEach((g) => {
      const ts = evTs(g.Created_At);
      if (ts && g.Score !== "" && !isNaN(Number(g.Score))) push(ts, "📊", `علامة ${esc(cleanSubject(g.Subject))} لـ ${fn}: <b>${roundOne(Number(g.Score))}</b>`, "good");
    });
    (session.behaviorNotes || []).forEach((n) => {
      if (String(n.Student_ID).trim() === sid) push(evTs(n.Date), "✍️", `ملاحظة من المعلم لـ ${fn}`, "info");
    });
  });
  const seen = {};
  kids.forEach((c) => {
    assignmentsForChild(c).forEach((t) => {
      const key = [t.Class_Level, t.Section, t.Date, t.Subject, String(t.Details || "").slice(0, 30)].join("|");
      if (!seen[key]) seen[key] = { t, names: [] };
      seen[key].names.push(esc(firstName(c.Student_Name)));
    });
  });
  Object.keys(seen).forEach((k) => {
    const { t, names } = seen[k];
    push(evTs(t.Date), "📚", `وظيفة ${esc(cleanSubject(t.Subject))} (${names.join(" و")})`, "info");
  });
  (session.payments || []).forEach((p) => {
    push(evTs(p.Payment_Date), "💳", `دفعة مسجّلة: <bdi>$${parseMoney(p.Amount).toLocaleString()}</bdi>`, "good");
  });
  ev.sort((a, b) => b.ts - a.ts);
  return ev.slice(0, 5);
}
function renderTimelineSection() {
  const ev = buildTimeline();
  const body = ev.length
    ? `<div class="tl">${ev.map((e) => `<div class="tl-item"><span class="tl-ic ${e.tone}">${e.icon}</span><div class="tl-text">${e.text}</div><div class="tl-when">${relDayLabel(e.ts)}</div></div>`).join("")}</div>`
    : emptyState("🌿", "لا مستجدات جديدة", "كل شيء هادئ. أي علامة أو غياب أو دفعة جديدة ستظهر هنا فوراً.");
  return accSection("tl", "🕘", "آخر المستجدات", ev.length ? String(ev.length) : "", body, true);
}

// ---------- تنبيه "ثبّت التطبيق" ----------
let deferredInstallPrompt = null;
function isStandalone() {
  return !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone);
}
function installPlatform() {
  const ua = navigator.userAgent || "";
  if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
  if (/android/i.test(ua)) return "android";
  return "other";
}
function installHiddenUntil() {
  try { return Number(localStorage.getItem("masar_install_hide") || 0); } catch (e) { return 0; }
}
function installBannerHtml() {
  if (isStandalone() || installPlatform() === "other" || Date.now() < installHiddenUntil()) return "";
  const plat = installPlatform();
  const how = plat === "ios"
    ? "اضغط زر المشاركة <b>⬆️</b> بأسفل المتصفح، ثم اختر «إضافة إلى الشاشة الرئيسية»."
    : (deferredInstallPrompt ? "" : "افتح قائمة المتصفح <b>⋮</b> ثم اختر «تثبيت التطبيق».");
  return `
    <div class="install-card">
      <div class="install-t">📲 ثبّت التطبيق على جوالك</div>
      <div class="install-s">يفتح أسرع كتطبيق مستقل، ويصلك إشعار بكل علامة وغياب ودفعة.</div>
      ${how ? `<div class="install-how">${how}</div>` : ""}
      <div class="install-btns">
        ${deferredInstallPrompt ? `<button type="button" class="ib main" onclick="installApp()">تثبيت الآن</button>` : ""}
        <button type="button" class="ib" onclick="hideInstall(7)">ليس الآن</button>
        <button type="button" class="ib" onclick="hideInstall(36500)">لا تذكّرني</button>
      </div>
    </div>`;
}
function hideInstall(days) {
  try { localStorage.setItem("masar_install_hide", String(Date.now() + days * 86400000)); } catch (e) {}
  renderApp();
}
async function installApp() {
  if (!deferredInstallPrompt) return;
  try {
    deferredInstallPrompt.prompt();
    const r = await deferredInstallPrompt.userChoice;
    if (r && r.outcome === "accepted") { try { localStorage.setItem("masar_install_hide", String(Date.now() + 36500 * 86400000)); } catch (e) {} }
  } catch (e) {}
  deferredInstallPrompt = null;
  if (session) renderApp();
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstallPrompt = e; if (session) renderApp(); });
window.addEventListener("appinstalled", () => {
  try { localStorage.setItem("masar_install_hide", String(Date.now() + 36500 * 86400000)); } catch (e) {}
  deferredInstallPrompt = null;
  if (session) renderApp();
});

// ---------- فتح فوري بآخر نسخة محفوظة + تحديث بالخلفية ----------
const SESSION_CACHE_KEY = "masar_cache_v1";
let lastFetchTs = Date.now();
let bgRefreshing = false;

function writeSessionCache(phone, data) {
  try {
    const copy = Object.assign({}, data);
    delete copy._pin;
    localStorage.setItem(SESSION_CACHE_KEY, JSON.stringify({ ts: Date.now(), phone: phone, data: copy }));
  } catch (e) { /* مساحة التخزين ممتلئة أو ممنوعة: نتجاهل */ }
}
function readSessionCache(phone) {
  try {
    const c = JSON.parse(localStorage.getItem(SESSION_CACHE_KEY) || "null");
    if (!c || c.phone !== phone || !c.data || !c.data.ok || !c.data.parent) return null;
    if (Date.now() - Number(c.ts || 0) > 14 * 86400000) return null; // أقدم من أسبوعين: لا نعرضه
    return c;
  } catch (e) { return null; }
}
function syncBarText() {
  if (!session) return "";
  if (session._refreshing) return "⏳ جارٍ تحديث البيانات…";
  if (session._refreshFailed) return "⚠️ تعذّر التحديث الآن — تُعرض آخر نسخة محفوظة";
  return session.lastUpdated ? `🕓 آخر تحديث للبيانات: ${session.lastUpdated}` : "";
}
function updateSyncBar() {
  const el = document.getElementById("syncBar");
  if (el) el.textContent = syncBarText();
}
function volatileFree(s) {
  const c = Object.assign({}, s);
  ["_refreshing", "_refreshFailed", "_cacheTs", "lastUpdated", "_pin", "_phone"].forEach((k) => { delete c[k]; });
  return JSON.stringify(c);
}
// تحديث صامت (بدون تغيير العبارة ولا نافذة الإعلانات) يُعاد رسم الصفحة فقط إذا تغيّرت البيانات فعلاً
async function backgroundRefresh() {
  if (!session || bgRefreshing || !session._phone) return;
  const ae = document.activeElement;
  if (showAnnouncements || showPayments || (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA"))) return;
  bgRefreshing = true;
  session._refreshing = true;
  updateSyncBar();
  const before = volatileFree(session);
  try {
    const r = await doLogin(session._phone, session._pin, !!getSavedCreds(), true);
    if (r.ok) {
      if (before !== volatileFree(session)) renderApp(); else updateSyncBar();
    } else if (session) { session._refreshing = false; updateSyncBar(); }
  } catch (err) {
    if (session) { session._refreshing = false; session._refreshFailed = true; updateSyncBar(); }
  } finally { bgRefreshing = false; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && session && Date.now() - lastFetchTs > 5 * 60 * 1000) backgroundRefresh();
});

// ---------- تفاصيل يوم بالتقويم ----------
function selectCalDay(key) {
  calSelectedDay = calSelectedDay === key ? "" : key;
  renderApp();
}

// ---------- الوظائف: علامة "تم" ----------
function taskKey(child, t) {
  return [child.Student_ID, t.Class_Level, t.Section, t.Date, t.Subject, String(t.Details || "").slice(0, 40)]
    .map((x) => String(x == null ? "" : x).trim()).join("|");
}
function doneStorageKey() { return "masar_done_" + (session && session.parent ? session.parent.Parent_ID : ""); }
function getDoneSet() {
  try { const a = JSON.parse(localStorage.getItem(doneStorageKey()) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function toggleTaskDone(key) {
  const set = getDoneSet();
  const i = set.indexOf(key);
  if (i >= 0) set.splice(i, 1); else set.push(key);
  try { localStorage.setItem(doneStorageKey(), JSON.stringify(set.slice(-400))); } catch (e) {}
  renderApp();
}

function renderApp() {
  const activeId = document.activeElement ? document.activeElement.id : null;
  const prevScroll = window.scrollY || 0;
  const app = document.getElementById("app");
  const TABS = ["home", "results", "assignments", "attendance", "more"];
  if (TABS.indexOf(currentTab) === -1) currentTab = "home";
  if (currentChildIndex >= session.children.length) currentChildIndex = 0;
  const child = session.children[currentChildIndex] || null;

  let contentHtml = "";
  if (currentTab === "home") {
    contentHtml = renderHome();
  } else if (!child) {
    contentHtml = `<div class="empty-box">لا يوجد طلاب مسجلين تحت هذا الحساب</div>`;
  } else {
    if (currentTab === "results") contentHtml = renderResults(child);
    if (currentTab === "assignments") contentHtml = renderAssignments(child);
    if (currentTab === "attendance") contentHtml = renderAttendance(child);
    if (currentTab === "more") contentHtml = renderMore(child);
  }

  const chips = session.children
    .map((c, i) => `<button class="chip ${i === currentChildIndex ? "active" : ""}" data-idx="${i}">${childNameWithAge(c.Student_Name, c.Birth_Date)}</button>`)
    .join("");

  const gradesCount = child ? childGradeRows(child).length : 0;
  const assignCount = child ? assignmentsForChild(child).length : 0;
  const moreCount = child
    ? (session.exams || []).length + (session.behaviorNotes || []).filter(n => String(n.Student_ID).trim() === String(child.Student_ID).trim()).length
    : 0;

  const showBadgeResults = child ? hasNew("results_" + child.Student_ID, gradesCount) : false;
  const showBadgeAssign = child ? hasNew("assign_" + child.Student_ID, assignCount) : false;
  const showBadgeMore = child ? hasNew("more_" + child.Student_ID, moreCount) : false;

  const tabBtn = (id, label, badge) =>
    `<button class="tab-btn ${currentTab === id ? "active" : ""}" data-tab="${id}">${badge ? '<span class="badge-dot"></span>' : ""}${TAB_ICONS[id] || ""}<span>${label}</span></button>`;

  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="avatar-small">${(session.parent.Parent_Name || "؟")[0]}</div>
          <div>
            <div style="color:#fff;font-size:15px;font-weight:600;">${session.parent.Parent_Name}</div>
            <div style="color:#B9C2D4;font-size:12.5px;">${session.children.length} طالب</div>
            <div id="liveClock" style="color:#8DA0C4;font-size:10.5px;margin-top:2px;">${getCurrentDateTimeText()}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${(session.announcements||[]).length ? `<button class="icon-btn" onclick="showAnnouncements=true;renderApp();">📢</button>` : ""}
          ${oneSignalAppId ? `<button class="icon-btn" onclick="requestPushPermission()" title="تفعيل الإشعارات">🔔</button>` : ""}
          <button class="icon-btn" id="refreshBtn" title="تحديث الصفحة">🔄</button>
          <button class="icon-btn" onclick="toggleDarkMode()" title="الوضع الليلي">${document.body.classList.contains('dark') ? '☀️' : '🌙'}</button>
          <button id="logoutBtn" class="logout-btn">خروج</button>
        </div>
      </div>
      ${financeStripHtml()}
    </div>
    <div id="syncBar" class="last-updated">${syncBarText()}</div>

    <div class="content">
      ${currentTab !== "home" && session.children.length > 0 ? `<div class="child-chips">${chips}</div>` : ""}
      ${contentHtml}
    </div>

    <div class="tabbar">
      ${tabBtn("home", "الرئيسية", false)}
      ${tabBtn("results", "النتائج", showBadgeResults)}
      ${tabBtn("assignments", "الوظائف", showBadgeAssign)}
      ${tabBtn("attendance", "الحضور", false)}
      ${tabBtn("more", "المزيد", showBadgeMore)}
    </div>
    ${renderAnnouncementsModal()}
    ${renderPaymentsModal()}
  `;

  // برمجة زر التحديث
  document.getElementById("refreshBtn").addEventListener("click", async function () {
    const btn = this;
    btn.innerHTML = "⏳";
    btn.disabled = true;
    try {
      const result = await doLogin(session._phone, session._pin, !!getSavedCreds());
      if (!result.ok) alert(result.error);
      else {
        showAnnouncements = (session.announcements || []).length > 0;
        renderApp();
      }
    } catch (err) {
      alert("تعذر الاتصال بالخادم");
      btn.innerHTML = "🔄";
      btn.disabled = false;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    session = null;
    currentTab = "home";
    currentChildIndex = 0;
    showPayments = false;
    homeOpenKid = -1;
    homeOpenKidInit = false;
    clearCreds();
    renderLogin();
  });

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", function () {
      currentTab = btn.getAttribute("data-tab");
      if (currentTab === "home") nextCheer();
      if (child) {
        if (currentTab === "results") setSeenCount("results_" + child.Student_ID, gradesCount);
        if (currentTab === "assignments") setSeenCount("assign_" + child.Student_ID, assignCount);
        if (currentTab === "more") setSeenCount("more_" + child.Student_ID, moreCount);
      }
      renderApp();
    });
  });

  document.querySelectorAll(".chip[data-idx]").forEach((btn) => {
    btn.addEventListener("click", function () {
      selectChild(Number(btn.getAttribute("data-idx")));
    });
  });

  document.querySelectorAll(".acc-item[data-kid] > .acc-head").forEach((btn) => {
    btn.addEventListener("click", () => toggleKid(Number(btn.parentElement.getAttribute("data-kid"))));
  });
  document.querySelectorAll(".acc-item[data-sec] > .acc-head").forEach((btn) => {
    btn.addEventListener("click", () => toggleSec(btn.parentElement.getAttribute("data-sec")));
  });

  // نُبقي اسم الطفل المختار ظاهراً في صف الأسماء (يُمرَّر أفقياً لمنتصفه بعد كل إعادة رسم)
  const activeChip = document.querySelector(".child-chips .chip.active[data-idx]");
  if (activeChip) {
    const box = activeChip.parentElement;
    const b = box.getBoundingClientRect();
    const r = activeChip.getBoundingClientRect();
    box.scrollLeft += (r.left + r.width / 2) - (b.left + b.width / 2);
  }

  startLiveClock();

  // استعادة المؤشر في حقل البحث بعد تحديث الصفحة لمنع تقطعه
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      const val = el.value;
      el.value = "";
      el.value = val;
    }
  }

  // نبقى بنفس مكان التمرير عند إعادة الرسم داخل نفس التبويب، ونبدأ من الأعلى عند تغيير التبويب
  window.scrollTo(0, lastRenderedTab === currentTab ? prevScroll : 0);
  lastRenderedTab = currentTab;
}

let parentAdminWhatsapp = "";

let oneSignalAppId = "";

async function fetchParentPublicSettings() {
  try {
    const res = await fetch(`${API_URL}?action=getPublicSettings`);
    const data = await res.json();
    if (data.ok) {
      parentAdminWhatsapp = data.Admin_WhatsApp || "";
      oneSignalAppId = data.OneSignal_AppId || "";
      initOneSignalIfConfigured();
    }
  } catch (err) { /* تجاهل — الزر سيظهر بدون رقم إن تعذّر الجلب */ }
}

// يهيّئ OneSignal فقط إذا كان المدير قد فعّل ميزة الإشعارات من لوحة التحكم (وضع App ID فعلي)
function initOneSignalIfConfigured() {
  if (!oneSignalAppId || typeof window === "undefined") return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function (OneSignal) {
    try {
      // المشروع على GitHub Pages داخل مجلد فرعي /Masar/، فلازم نحدد مسار ونطاق العامل صراحةً
      await OneSignal.init({
        appId: oneSignalAppId,
        // بدون هذا السطر، إذا كان التطبيق مُعدّاً بلوحة OneSignal كـ "Typical Site" يتجاهل الـ SDK
        // المسار المكتوب هنا ويطلب /OneSignalSDKWorker.js من جذر الموقع (404 على GitHub Pages)
        serviceWorkerOverrideForTypical: true,
        path: "/",
        serviceWorkerPath: "Masar/sw.js",
        serviceWorkerParam: { scope: "/Masar/" },
      });
      // إذا سجّل ولي الأمر دخوله قبل وصول الإعدادات (دخول تلقائي)، نربطه الآن
      if (session && session.parent && session.parent.Parent_ID) {
        await OneSignal.login(String(session.parent.Parent_ID));
      }
    } catch (err) { console.error("OneSignal init failed:", err); }
  });
}

// يربط جهاز ولي الأمر الحالي بمعرّفه (Parent_ID) داخل OneSignal، ليصبح بالإمكان
// استهدافه بإشعار خاص به فقط (دفعة، علامة، غياب...) دون بث عام لكل الأهالي
function linkOneSignalToParent(parentId) {
  if (!oneSignalAppId || !parentId) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(function (OneSignal) {
    OneSignal.login(String(parentId)).catch((e) => console.error("OneSignal login failed:", e));
  });
}

// يطلب إذن الإشعارات من المستخدم صراحة (زر بدل نافذة تلقائية) — مطلوب خصوصاً على آيفون
function requestPushPermission() {
  if (!oneSignalAppId) { alert("لم تُفعَّل ميزة الإشعارات بعد من قبل إدارة المدرسة"); return; }
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(function (OneSignal) {
    OneSignal.Notifications.requestPermission().catch((e) => console.error("OneSignal permission failed:", e));
  });
}

function forgotPasswordUrlParent() {
  if (!parentAdminWhatsapp) return "";
  const msg = encodeURIComponent("مرحباً، نسيت كلمة سري لتطبيق مسار (بوابة أولياء الأمور). رقم هاتفي: ");
  return `https://wa.me/${parentAdminWhatsapp}?text=${msg}`;
}

(function bootstrapParentApp() {
  applyDarkModePref();
  // لا ننتظر جلب رقم واتساب الإدارة — يشتغل بالخلفية بالتوازي مع محاولة الدخول،
  // حتى لا تتعطل شاشة الدخول بالكامل لثوانٍ إضافية بانتظار طلب غير ضروري لعرضها.
  fetchParentPublicSettings().then(() => {
    if (!session) renderLogin(); // أعد الرسم فقط إذا لسا واقف على شاشة الدخول، لإظهار زر واتساب
  });
  tryAutoLogin();
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
