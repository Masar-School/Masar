<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Tahoma, Arial, sans-serif; background: #FCF4F2; }
  #app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: #FCF4F2; display: flex; flex-direction: column; }

  .login-header { background: #A63A3A; padding: 56px 24px 40px; text-align: center; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: #F2B8A8; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px; font-weight: 700; color: #7A2626; }
  .school-name { color: #fff; font-size: 20px; font-weight: 600; }
  .school-sub { color: #F3D3D0; font-size: 13px; margin-top: 4px; }

  form { padding: 32px 24px; flex: 1; }
  label { font-size: 13px; color: #6B4A4A; display: block; margin-bottom: 6px; }
  .field { display: flex; align-items: center; background: #fff; border: 1px solid #E9CFC9; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .field input { border: none; outline: none; flex: 1; margin-right: 10px; font-size: 15px; background: transparent; text-align: right; direction: rtl; }
  .error { color: #A63A3A; font-size: 13px; margin-bottom: 8px; }
  .btn-main { width: 100%; background: #A63A3A; color: #fff; border: none; border-radius: 12px; padding: 14px 0; font-size: 15px; font-weight: 600; margin-top: 12px; cursor: pointer; }
  .btn-main:disabled { opacity: 0.6; }

  .header { background: #A63A3A; padding: 20px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
  .logout-btn { background: transparent; border: none; color: #F3D3D0; font-size: 13px; cursor: pointer; }
  .content { flex: 1; padding: 16px 18px 24px; }

  .roster-item { background: #fff; border: 1px solid #F0DAD5; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .roster-name { font-size: 14px; font-weight: 500; color: #2C2C2A; }
  .roster-id { font-size: 12px; color: #A98080; }
  .empty-box { text-align: center; padding: 40px 20px; color: #A98080; font-size: 14px; }

  .admin-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; padding: 2px 2px 6px; }
  .admin-tab-btn { flex-shrink: 0; padding: 12px 20px; border-radius: 999px; background: #fff; border: 1px solid #E9CFC9; font-size: 14.5px; font-weight: 600; color: #6B4A4A; cursor: pointer; white-space: nowrap; }
  .admin-tab-btn.active { background: #A63A3A; color: #fff; border-color: #A63A3A; box-shadow: 0 2px 8px rgba(166,58,58,0.35); }

  .section-title { font-size: 14px; font-weight: 700; color: #2C2C2A; margin: 4px 0 10px; }
  .form-card { background: #fff; border: 1px solid #F0DAD5; border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .form-field { margin-bottom: 12px; }
  .form-field label { font-size: 12.5px; color: #6B4A4A; display: block; margin-bottom: 5px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; border: 1px solid #E9CFC9; border-radius: 10px; padding: 10px 12px; font-size: 14px; text-align: right; direction: rtl; font-family: inherit; }
  textarea { resize: vertical; }
  .btn-save { background: #A63A3A; color: #fff; border: none; border-radius: 10px; padding: 11px 0; width: 100%; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .btn-save:disabled { opacity: 0.6; }
  .form-msg { font-size: 12.5px; margin-top: 8px; }
  .form-msg.ok { color: #2E7D5B; }
  .form-msg.err { color: #A63A3A; }

  .student-row { background: #fff; border: 1px solid #F0DAD5; border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .student-info .name { font-size: 13.5px; font-weight: 500; color: #2C2C2A; }
  .student-info .meta { font-size: 11.5px; color: #A98080; margin-top: 2px; }
  .status-pill { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 600; border: none; cursor: pointer; }
  .status-active { background: #E1F5EE; color: #085041; }
  .status-inactive { background: #F1EFE8; color: #8A8578; }
  .search-field-admin { display: flex; align-items: center; background: #fff; border: 1px solid #E9CFC9; border-radius: 12px; padding: 9px 12px; margin-bottom: 14px; }
  .search-field-admin input { border: none; outline: none; flex: 1; margin-right: 8px; font-size: 13.5px; background: transparent; text-align: right; direction: rtl; }

  .attendance-row { background: #fff; border: 1px solid #F0DAD5; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .attendance-toggle { display: flex; gap: 6px; }
  .att-btn { border: 1px solid #E9CFC9; background: #fff; color: #6B4A4A; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .att-btn.att-present { background: #E1F5EE; color: #085041; border-color: #E1F5EE; }
  .att-btn.att-absent { background: #FBE3E0; color: #A63A3A; border-color: #FBE3E0; }

  .parent-summary { background: #A63A3A; color: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13.5px; }
  .summary-children { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.25); font-size: 12.5px; }
  .summary-children div { margin-bottom: 4px; color: #F3D3D0; }
  .supervisor-card { background: #fff; border: 1px solid #F0DAD5; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .supervisor-name { font-size: 14px; font-weight: 600; color: #2C2C2A; margin-bottom: 8px; }
  .link-btn { display: inline-block; background: #E1F5EE; color: #085041; font-size: 12px; padding: 6px 12px; border-radius: 8px; text-decoration: none; margin-top: 6px; }

  /* كاليندار الحضور وكاليندار العطل */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav-btn { background: #fff; border: 1px solid #E9CFC9; color: #2C2C2A; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 16px; }
  .cal-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .cal-title { font-size: 15.5px; font-weight: 700; color: #2C2C2A; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 16px; }
  .cal-dow { text-align: center; font-size: 11.5px; color: #A98080; padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 13.5px; font-weight: 600; }
  .cal-cell.empty { visibility: hidden; }
  .cal-present { background: #DDF0DE; color: #1E5E27; }
  .cal-absent { background: #FBDEDC; color: #8E2A22; }
  .cal-late { background: #FCEBC7; color: #8A5A0A; }
  .cal-weekend { background: #DCE7F7; color: #294A80; }
  .cal-holiday { background: #E4D6F5; color: #532E80; }
  .cal-neutral { background: #fff; border: 1px solid #F0DAD5; color: #A98080; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; font-size: 12px; color: #6B4A4A; }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
  .holiday-table { width: 100%; border-collapse: collapse; }
  .holiday-table td { padding: 9px 4px; border-bottom: 1px solid #F0DAD5; font-size: 13.5px; color: #2C2C2A; }
  .holiday-table td.hdate { color: #A98080; font-size: 12px; }
  .search-result-item { background: #fff; border: 1px solid #F0DAD5; border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .search-result-item:hover { border-color: #A63A3A; }
  .selected-student-bar { display: flex; justify-content: space-between; align-items: center; background: #A63A3A; color: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  .selected-student-bar .name { font-size: 15px; font-weight: 700; }
  .selected-student-bar .meta { font-size: 12px; color: #F3D3D0; margin-top: 2px; }
  .change-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 12.5px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

  /* شريط المجموعات الرئيسي + الشريط الفرعي */
  .group-tabs { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding: 2px 2px 6px; }
  .group-tab-btn { flex-shrink: 0; padding: 11px 18px; border-radius: 999px; background: #fff; border: 1px solid #E9CFC9; font-size: 14px; font-weight: 700; color: #6B4A4A; cursor: pointer; white-space: nowrap; }
  .group-tab-btn.active { background: #7A2626; color: #fff; border-color: #7A2626; box-shadow: 0 2px 8px rgba(122,38,38,0.3); }
  .sub-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding: 2px 2px 6px; }
  .sub-tab-btn { flex-shrink: 0; padding: 8px 15px; border-radius: 999px; background: #FBEDE9; border: 1px solid #F0DAD5; font-size: 13px; color: #7A2626; cursor: pointer; white-space: nowrap; }
  .sub-tab-btn.active { background: #A63A3A; color: #fff; border-color: #A63A3A; }

  .void-row { opacity: 0.55; }
  .void-badge { background: #F1EFE8; color: #8A8578; font-size: 10.5px; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
  .divider-line { height: 1px; background: #F0DAD5; margin: 22px 0 18px; }

  /* لوحة التحكم التحليلية (المدير فقط) */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat-card { background: #fff; border: 1px solid #F0DAD5; border-radius: 14px; padding: 16px 10px; text-align: center; }
  .stat-icon { font-size: 24px; margin-bottom: 6px; }
  .stat-number { font-size: 23px; font-weight: 800; color: #7A2626; line-height: 1.1; }
  .stat-label { font-size: 11px; color: #A98080; margin-top: 4px; }

  .donut-row { display: flex; justify-content: center; gap: 18px; margin: 4px 0 20px; flex-wrap: wrap; }
  .donut-box { text-align: center; }
  .donut-caption { font-size: 12px; color: #6B4A4A; margin-top: 6px; font-weight: 700; }

  .cbc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .cbc-label { font-size: 12px; color: #6B4A4A; width: 76px; flex-shrink: 0; font-weight: 600; }
  .cbc-track { flex: 1; background: #F5EAE6; border-radius: 7px; height: 17px; overflow: hidden; }
  .cbc-fill { height: 100%; background: linear-gradient(90deg,#A63A3A,#E29079); border-radius: 7px; transition: width .4s; }
  .cbc-count { font-size: 12px; font-weight: 800; color: #2C2C2A; width: 24px; text-align: left; }

  .class-summary-card { background: #fff; border: 1px solid #F0DAD5; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .class-summary-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .class-summary-title { font-size: 14px; font-weight: 800; color: #2C2C2A; }
  .sec-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sec-bar-label { font-size: 11px; color: #A98080; width: 52px; flex-shrink: 0; }
  .sec-bar-track { flex: 1; background: #F5EAE6; border-radius: 5px; height: 12px; overflow: hidden; }
  .sec-bar-fill { height: 100%; background: #7A9CA6; border-radius: 5px; transition: width .4s; }
  .sec-bar-count { font-size: 11px; font-weight: 700; color: #2C2C2A; width: 18px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz6ELxp6ppDgAvygOQdPeP9pdHWjzpOJuQwVmQHW3TGKggW-olcNVTcLxsYwRFUCOn-tQ/exec";

const SUBJECTS = ["لغة عربية", "لغة إنجليزية", "رياضيات", "علوم", "تربية إسلامية", "دراسات اجتماعية", "حاسب آلي", "تربية فنية", "تربية بدنية", "عام"];
const EXAM_TYPES = ["المذاكرة الأولى", "المذاكرة الثانية", "الامتحان النهائي للفصل"];
const SEMESTERS = ["الفصل الأول", "الفصل الثاني"];

let staffSession = null;

let adminGroup = "students";   // المجموعة الرئيسية المفتوحة
let adminTab = "students";     // التبويب الفرعي المفتوح
let studentSearch = "";
let addStudentMsg = "";

let teacherTab = "roster";
let attendanceDate = null;
let attendanceDraft = {};
let attendanceMsg = "";
let behaviorMsg = "";
let gradeMsg = "";
let assignmentMsg = "";

let adminGradeSearchTerm = "";
let adminGradeSelectedStudentId = "";

const ARABIC_MONTHS = ["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const ARABIC_DOW = ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
const ARABIC_DOW_FULL = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const CAL_MAX_YEAR = 2028; 
let attSearchTerm = "";
let attSelectedStudentId = "";
let attCalYear = new Date().getFullYear();
let attCalMonth = new Date().getMonth();

let holCalYear = new Date().getFullYear();
let holCalMonth = new Date().getMonth();
let addHolidayMsg = "";

let clockIntervalStarted = false;

// ---------------------------------------------------------------------------
// سياق المدير: الصف والشعبة المختارين لتبويبات الحضور/السلوك/العلامات/الواجبات
// ---------------------------------------------------------------------------
// سياق الصف/الشعبة — مشترك بين المدير والمعلم
let ctxClass = "";
let ctxSection = "";

function isAdmin() {
  return staffSession && staffSession.role === "Admin";
}

// شعبة فارغة أو "*" في النطاق تعني: كل شعب هذا الصف
function sectionMatches(scopeSection, studentSection) {
  const sec = String(scopeSection || "").trim();
  if (sec === "" || sec === "*") return true;
  return sec === String(studentSection || "").trim();
}

// الصفوف/الشعب التي يحق للمعلم العمل عليها (قد تكون عدة صفوف)
function getTeacherClassOptions() {
  const scopes = staffSession.scopes || [];
  const pairs = [];
  scopes.forEach(sc => {
    const key = sc.Class_Level + "|" + (sc.Section || "");
    if (!pairs.some(p => p.key === key)) {
      pairs.push({ key: key, Class_Level: sc.Class_Level, Section: sc.Section || "" });
    }
  });
  return pairs;
}

// المواد التي يحق للمعلم إدخالها في الصف/الشعبة المختارة
function getAllowedSubjects() {
  if (isAdmin()) return SUBJECTS;
  const scopes = staffSession.scopes || [];
  const out = [];
  scopes.forEach(sc => {
    if (sc.Class_Level === ctxClass && sectionMatches(sc.Section, ctxSection)) {
      if (sc.Subject === "*") { SUBJECTS.forEach(x => { if (out.indexOf(x) === -1) out.push(x); }); }
      else if (out.indexOf(sc.Subject) === -1) out.push(sc.Subject);
    }
  });
  return out;
}

// الطلاب الفعّالون في السياق الحالي (يعمل للمدير وللمعلم بنفس المنطق)
function getActiveRoster() {
  if (isAdmin()) {
    if (!ctxClass) return [];
    return (staffSession.students || []).filter(s => {
      if (String(s.Status || "Active").trim() === "Inactive") return false;
      if (String(s.Class_Level || "").trim() !== ctxClass) return false;
      return ctxSection === "" || String(s.Section || "").trim() === ctxSection;
    }).map(s => ({
      Student_ID: s.Student_ID, Student_Name: s.Student_Name,
      Class_Level: s.Class_Level, Section: s.Section, Supervisor_Name: s.Supervisor_Name || ""
    }));
  }

  const roster = staffSession.roster || [];
  const options = getTeacherClassOptions();
  // معلم بصف واحد فقط: لا حاجة لاختيار
  if (options.length <= 1) return roster;
  if (!ctxClass) return [];
  return roster.filter(s =>
    String(s.Class_Level || "").trim() === ctxClass &&
    (ctxSection === "" || String(s.Section || "").trim() === ctxSection)
  );
}

// هل السياق مطلوب اختياره قبل عرض المحتوى؟
function needsContextPick() {
  if (isAdmin()) return !ctxClass;
  return getTeacherClassOptions().length > 1 && !ctxClass;
}

// شريط اختيار الصف والشعبة (يظهر للمدير فقط)
function renderAdminContextPicker() {
  if (isAdmin()) {
    const classes = CLASS_LEVELS_LIST.map(c =>
      `<option value="${c}" ${c === ctxClass ? "selected" : ""}>${c}</option>`).join("");
    const sections = ["", "1", "2", "3"].map(sec =>
      `<option value="${sec}" ${sec === ctxSection ? "selected" : ""}>${sec === "" ? "كل الشعب" : "شعبة " + sec}</option>`).join("");
    return `
      <div class="form-card" style="background:#FFF7F5;">
        <div class="section-title">🎯 اختر الصف والشعبة للعمل عليهما</div>
        <div class="form-field">
          <label>الصف</label>
          <select onchange="ctxClass=this.value; attendanceDraft={}; renderDashboard();">
            <option value="">— اختر الصف —</option>
            ${classes}
          </select>
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label>الشعبة</label>
          <select onchange="ctxSection=this.value; attendanceDraft={}; renderDashboard();">${sections}</select>
        </div>
      </div>
    `;
  }

  // المعلم: يختار من صفوفه المسندة فقط (يظهر فقط إذا كان يدرّس أكثر من صف)
  const options = getTeacherClassOptions();
  if (options.length <= 1) return "";

  const opts = options.map(o => {
    const label = o.Class_Level + (o.Section && o.Section !== "*" ? " — شعبة " + o.Section : " — كل الشعب");
    const selected = (o.Class_Level === ctxClass && (o.Section || "") === ctxSection) ? "selected" : "";
    return `<option value="${o.Class_Level}|${o.Section}" ${selected}>${label}</option>`;
  }).join("");

  return `
    <div class="form-card" style="background:#FFF7F5;">
      <div class="section-title">🎯 اختر الصف الذي تعمل عليه</div>
      <div class="form-field" style="margin-bottom:0;">
        <select onchange="setTeacherContext(this.value);">
          <option value="">— اختر الصف —</option>
          ${opts}
        </select>
      </div>
    </div>
  `;
}

function setTeacherContext(value) {
  const parts = String(value || "").split("|");
  ctxClass = parts[0] || "";
  ctxSection = parts[1] === "*" ? "" : (parts[1] || "");
  attendanceDraft = {};
  renderDashboard();
}

// ---------------------------------------------------------------------------
// كشف التكرار في الأسماء (تنبيه فقط — المعرّفات ID يمنعها الخادم نهائياً)
// ---------------------------------------------------------------------------

// توحيد شكل الاسم العربي للمقارنة: إزالة التشكيل، توحيد الألف والياء والتاء المربوطة
function normalizeArabicName(value) {
  return String(value || "")
    .replace(/[\u064B-\u0652\u0640]/g, "")   // تشكيل وتطويل
    .replace(/[أإآا]/g, "ا")
    .replace(/[ىي]/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

// ترجع قائمة السجلات التي تحمل نفس الاسم
function findNameDuplicates(list, nameField, newName) {
  const target = normalizeArabicName(newName);
  if (!target) return [];
  return (list || []).filter(item => normalizeArabicName(item[nameField]) === target);
}

// تعرض تنبيهاً وترجع true إذا وافق المستخدم على المتابعة
function confirmDuplicateName(duplicates, describeFn, label) {
  if (duplicates.length === 0) return true;
  const lines = duplicates.map(d => "• " + describeFn(d)).join("\n");
  return confirm(
    `⚠️ تنبيه: يوجد ${duplicates.length} ${label} بنفس الاسم مسجّل مسبقاً:\n\n${lines}\n\n` +
    `المعرّف (ID) سيكون مختلفاً ولن يتكرر أبداً.\nهل تريد المتابعة والإضافة؟`
  );
}


// ---------------------------------------------------------------------------
// دوال الساعة والتاريخ المباشرة
// ---------------------------------------------------------------------------
function getCurrentDateTimeText() {
  const now = new Date();
  const dow = ARABIC_DOW_FULL[now.getDay()];
  const day = now.getDate();
  const month = ARABIC_MONTHS[now.getMonth()];
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const period = hours >= 12 ? "م" : "ص";
  hours = hours % 12;
  if (hours === 0) hours = 12;
  return `${dow}، ${day} ${month} · ${hours}:${minutes} ${period}`;
}

function startLiveClock() {
  if (clockIntervalStarted) return;
  clockIntervalStarted = true;
  setInterval(() => {
    const el = document.getElementById("liveClock");
    if (el) el.textContent = getCurrentDateTimeText();
  }, 30000);
}

async function submitEditGrade(gradeId) {
  const payload = {
    action: "updateGrade",
    adminUsername: staffSession.username,
    adminPassword: staffSession._password,
    Grade_ID: gradeId,
    Subject: document.getElementById("egSubject").value,
    Exam_Type: document.getElementById("egExam").value,
    Semester: document.getElementById("egSemester").value,
    Score: document.getElementById("egScore").value
  };
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      const g = (staffSession.grades || []).find(x => String(x.Grade_ID) === String(gradeId));
      if (g) Object.assign(g, {
        Subject: payload.Subject, Exam_Type: payload.Exam_Type,
        Semester: payload.Semester, Score: payload.Score
      });
      editingGradeId = null;
      renderDashboard();
    } else {
      document.getElementById("egMsg").innerHTML = `<div class="form-msg err">${data.error}</div>`;
    }
  } catch (err) {
    document.getElementById("egMsg").innerHTML = `<div class="form-msg err">تعذر الاتصال بالخادم</div>`;
  }
}

async function toggleGradeStatus(gradeId, newStatus) {
  let reason = "";
  if (newStatus === "Void") {
    reason = prompt("سبب إلغاء العلامة (إجباري):", "");
    if (reason === null) return;
    if (String(reason).trim() === "") { alert("لا يمكن الإلغاء بدون كتابة السبب"); return; }
  }
  const payload = {
    action: "setGradeStatus",
    adminUsername: staffSession.username,
    adminPassword: staffSession._password,
    Grade_ID: gradeId,
    Status: newStatus,
    Void_Reason: String(reason).trim()
  };
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      const g = (staffSession.grades || []).find(x => String(x.Grade_ID) === String(gradeId));
      if (g) { g.Status = newStatus; g.Void_Reason = payload.Void_Reason; }
      renderDashboard();
    } else { alert(data.error || "حدث خطأ"); }
  } catch (err) { alert("تعذر الاتصال بالخادم"); }
}

  const normPhone = (v) => String(v || "").replace(/[\s\-()+]/g, "").trim();
  const phoneClash = (staffSession.parents || []).find(p => normPhone(p.Phone) === normPhone(parentPhone));
  if (phoneClash) {
    addParentMsg = `<div class="form-msg err">رقم الهاتف مستخدم مسبقاً لولي الأمر: ${phoneClash.Parent_Name} (${phoneClash.Parent_ID}). رقم الهاتف هو مفتاح الدخول ولا يمكن تكراره.</div>`;
    renderDashboard();
    return;
  }

  // تنبيه (وليس منع) عند تكرار الاسم
  const dups = findNameDuplicates(staffSession.parents, "Parent_Name", parentName);
  if (!confirmDuplicateName(dups, d => `${d.Parent_Name} — ${d.Parent_ID}`, "ولي أمر")) {
    renderDashboard();
    return;
  }

  const btn = document.getElementById("addParentBtn");
  btn.disabled = true;
  btn.textContent = "جارِ الحفظ...";

  const payload = {
    action: "addParent",
    adminUsername: staffSession.username,
    adminPassword: staffSession._password,
    Parent_Name: parentName,
    Phone: parentPhone,
    PIN_Code: document.getElementById("newParentPin").value.trim()
  };

  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (!data.ok) {
      addParentMsg = `<div class="form-msg err">${data.error}</div>`;
    } else {
      addParentMsg = `<div class="form-msg ok">تمت إضافة ولي الأمر برقم ${data.newParentId} ✓ اختره الآن من قائمة "ولي الأمر" بالأسفل</div>`;
      staffSession.parents.push({ Parent_ID: data.newParentId, Parent_Name: payload.Parent_Name });

  } catch (err) {
    addParentMsg = `<div class="form-msg err">تعذر الاتصال بالخادم</div>`;
  }
  renderDashboard();
}

function parseMoney(val) {
  if (typeof val === "number") return val;
  if (!val) return 0;
  let s = String(val).trim();
  s = s.replace(/[٬,]/g, "");     // إزالة فواصل الآلاف (عربية وعادية)
  s = s.replace(/٫/g, ".");       // تحويل الفاصلة العشرية العربية إلى نقطة
  s = s.replace(/[^0-9.\-]/g, ""); // إزالة أي رمز آخر ($ وغيره)
  return Number(s) || 0;
}

async function submitEditPayment(paymentId) {
  const reason = document.getElementById("epReason").value.trim();
  if (reason === "") {
    document.getElementById("epMsg").innerHTML = `<div class="form-msg err">سبب التعديل إجباري</div>`;
    return;
  }

  const payload = {
    action: "updatePayment",
    adminUsername: staffSession.username,
    adminPassword: staffSession._password,
    Payment_ID: paymentId,
    Amount: document.getElementById("epAmount").value,
    Payment_Date: document.getElementById("epDate").value,
    Payment_Method: document.getElementById("epMethod").value,
    Total_Required: document.getElementById("epTotal").value,
    Notes: document.getElementById("epNotes").value.trim(),
    Edit_Reason: reason
  };

  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      await refreshSession();
      editingPaymentId = null;
      renderDashboard();
    } else {
      document.getElementById("epMsg").innerHTML = `<div class="form-msg err">${data.error}</div>`;
    }
  } catch (err) {
    document.getElementById("epMsg").innerHTML = `<div class="form-msg err">تعذر الاتصال بالخادم</div>`;
  }
}

async function togglePaymentStatus(paymentId, newStatus) {

async function refreshSession() {
  try {
    const url = `${API_URL}?action=staffLogin&username=${encodeURIComponent(staffSession.username)}&password=${encodeURIComponent(staffSession._password)}`;
    const res = await fetch(url);

async function saveSupervisor(supervisorId) {
  const newName = document.getElementById("supName_" + supervisorId).value.trim();

  const dups = findNameDuplicates(staffSession.supervisors, "Supervisor_Name", newName)
    .filter(d => d.Supervisor_ID !== supervisorId);
  if (!confirmDuplicateName(
        dups,
        d => `${d.Supervisor_Name} — ${d.Supervisor_ID} · ${d.Route_Area || "بدون منطقة"}`,
        "مشرف/ة باص")) {
    return;
  }

  const payload = {
    action: "updateSupervisor",
    adminUsername: staffSession.username,
    adminPassword: staffSession._password,
    Supervisor_ID: supervisorId,
    Supervisor_Name: newName,
    Phone: document.getElementById("supPhone_" + supervisorId).value.trim(),
    Route_Area: document.getElementById("supRoute_" + supervisorId).value.trim(),
    Live_Location_URL: document.getElementById("supUrl_" + supervisorId).value.trim()
  };
  try {

function ymd(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function getAllStudentsForSearch() {
  if (staffSession.role === "Admin") return staffSession.students || [];
  return staffSession.allStudents || [];
}
function getAllAttendanceForSearch() {
  if (staffSession.role === "Admin") return staffSession.attendance || [];
  return staffSession.allAttendance || [];
}
function getHolidaysList() {
  return staffSession.holidays || [];
}

function changeAttCalMonth(delta) {
  attCalMonth += delta;
  if (attCalMonth < 0) { attCalMonth = 11; attCalYear--; }
  if (attCalMonth > 11) { attCalMonth = 0; attCalYear++; }
  if (attCalYear > CAL_MAX_YEAR) { attCalYear = CAL_MAX_YEAR; attCalMonth = 11; }
  renderDashboard();
}

function renderMonthCalendar(year, month, attMap, holidayMap) {
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dow = new Date(year, month, day).getDay();
    const key = ymd(year, month, day);
    let cls = "cal-neutral", title = "";
    if (dow === 5 || dow === 6) { cls = "cal-weekend"; title = "عطلة نهاية أسبوع"; }
    else if (holidayMap[key]) { cls = "cal-holiday"; title = holidayMap[key]; }
    else if (attMap && attMap[key]) {
      const st = attMap[key];
      if (st.includes("غائب") || st.includes("غياب")) { cls = "cal-absent"; title = "غياب"; }
      else if (st.includes("متأخر") || st.includes("تأخير")) { cls = "cal-late"; title = "تأخير"; }
      else { cls = "cal-present"; title = "حضور"; }
    }
    cells += `<div class="cal-cell ${cls}" title="${title}">${day}</div>`;
  }
  return `
    <div class="cal-grid">
      ${ARABIC_DOW.map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
  `;
}

        <span>🔎</span>

      html += `<div class="empty-box">اكتب اسم الطالب لعرض كاليندار حضوره الشهري</div>`;
    } else if (results.length === 0) {

    } else {

  }

  const attMap = {};
  getAllAttendanceForSearch()
    .filter(a => String(a.Student_ID).trim() === String(student.Student_ID).trim())
    .forEach(a => {
      const d = new Date(a.Date);
      if (!isNaN(d)) attMap[ymd(d.getFullYear(), d.getMonth(), d.getDate())] = String(a.Status || "");

  const holidayMap = {};

  });

  const monthRecords = getAllAttendanceForSearch()

  let detailsHtml = `<div class="section-title">📋 تفاصيل الدوام — ${ARABIC_MONTHS[attCalMonth]} ${attCalYear}</div>`;

    detailsHtml += `<div class="empty-box">لا توجد سجلات حضور مسجلة لهذا الشهر</div>`;
  } else {
    detailsHtml += `<table class="holiday-table">`;
    monthRecords.forEach(a => {
      const d = new Date(a.Date);
      detailsHtml += `<tr><td>${d.getDate()} ${ARABIC_MONTHS[attCalMonth]}</td><td class="hdate">${a.Status || ""}</td></tr>`;
    });
    detailsHtml += `</table>`;
  }

  const atMax = attCalYear >= CAL_MAX_YEAR && attCalMonth === 11;

  return `
    <div class="selected-student-bar">
      <div>
        <div class="name">${student.Student_Name}</div>
        <div class="meta">${student.Class_Level || ""} ${student.Section ? "- شعبة " + student.Section : ""}</div>
      </div>
      <button class="change-btn" onclick="attSelectedStudentId='';attSearchTerm='';renderDashboard();">تغيير الطالب</button>
    </div>
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeAttCalMonth(-1)">›</button>
      <div class="cal-title">${ARABIC_MONTHS[attCalMonth]} ${attCalYear}</div>
      <button class="cal-nav-btn" ${atMax ? "disabled" : ""} onclick="changeAttCalMonth(1)">‹</button>
    </div>
    ${renderMonthCalendar(attCalYear, attCalMonth, attMap, holidayMap)}
    <div class="cal-legend">
      <span><span class="legend-dot" style="background:#DDF0DE;"></span>حضور</span>
      <span><span class="legend-dot" style="background:#FBDEDC;"></span>غياب</span>
      <span><span class="legend-dot" style="background:#FCEBC7;"></span>تأخير</span>
      <span><span class="legend-dot" style="background:#DCE7F7;"></span>عطلة نهاية أسبوع</span>
      <span><span class="legend-dot" style="background:#E4D6F5;"></span>عطلة رسمية</span>
    </div>
    ${detailsHtml}
  `;
}

    action: "deleteHoliday",
    adminUsername: staffSession.username,
    adminPassword: staffSession._password,
    Holiday_ID: holidayId,
    Date: date
  };
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      staffSession.holidays = (staffSession.holidays || []).filter(h => {
        if (holidayId) return String(h.Holiday_ID) !== String(holidayId);
        return String(h.Date) !== String(date);

    } else {
      alert(data.error || "حدث خطأ");

  } catch (err) {
    alert("تعذر الاتصال بالخادم");

}

function renderTeacherAttendanceTab() {
  const roster = getActiveRoster();
  if (!attendanceDate) attendanceDate = staffSession.todayDate;
  // حماية إضافية: أي تاريخ مستقبلي يُرجع لليوم الحالي
  if (attendanceDate > staffSession.todayDate) attendanceDate = staffSession.todayDate;
  if (needsContextPick()) return renderAdminContextPicker() + `<div class="empty-box">اختر الصف أولاً لتسجيل الحضور</div>`;

  const existingForDate = {};
  (staffSession.attendance || []).forEach(a => {
    if (String(a.Date).trim() === attendanceDate) {
      existingForDate[String(a.Student_ID).trim()] = a.Status;
    }
  });
  roster.forEach(s => {
    if (attendanceDraft[s.Student_ID] === undefined) {
      attendanceDraft[s.Student_ID] = existingForDate[s.Student_ID] || "حاضر";
    }
  });

  let rows = "";
  roster.forEach(s => {
    const current = attendanceDraft[s.Student_ID] || "حاضر";
    rows += `
      <div class="attendance-row">
        <span class="roster-name">${s.Student_Name}</span>
        <div class="attendance-toggle">
          <button type="button" class="att-btn ${current === "حاضر" ? "att-present" : ""}" onclick="setAttendanceDraft('${s.Student_ID}','حاضر')">حاضر</button>
          <button type="button" class="att-btn ${current === "غائب" ? "att-absent" : ""}" onclick="setAttendanceDraft('${s.Student_ID}','غائب')">غائب</button>
        </div>
      </div>
    `;
  });

  // من سجّل حضور هذا اليوم قبلي؟ (عدة معلمين يشاركون نفس الصف)
  let recordedBy = "";
  const todayRecs = (staffSession.attendance || []).filter(a =>
    String(a.Date).trim() === attendanceDate &&
    roster.some(r => String(r.Student_ID) === String(a.Student_ID)) &&
    String(a.Teacher_User || "").trim() !== ""
  );
  if (todayRecs.length > 0) {
    const users = [];
    todayRecs.forEach(a => {
      const u = String(a.Teacher_User).trim();
      if (users.indexOf(u) === -1) users.push(u);
    });
    const names = users.map(u => {
      const t = (staffSession.teachers || []).find(x => String(x.Username).trim() === u);
      return t && t.Name ? t.Name : u;
    });
    const mine = users.length === 1 && users[0] === staffSession.username;
    recordedBy = `<div class="form-msg ${mine ? "ok" : "err"}" style="margin-bottom:10px;">
      ${mine ? "✓ أنت سجّلت حضور هذا اليوم" : "⚠️ حضور هذا اليوم مسجّل مسبقاً بواسطة: " + names.join("، ") + " — الحفظ سيعدّل تسجيلهم"}
    </div>`;
  }

  return renderAdminContextPicker() + `
    <div class="form-card">
      <div class="section-title">📅 تسجيل الحضور</div>
      ${recordedBy}
      <div class="form-field">
        <label>التاريخ</label>
        <select id="attendanceDateInput" onchange="attendanceDate=this.value; attendanceDraft={}; renderDashboard();">
          ${buildAttendanceDateOptions()}
        </select>

      </div>

      <button class="btn-save" id="saveAttendanceBtn" onclick="submitAttendance()">حفظ الحضور</button>

// خيارات تاريخ الحضور: اليوم فقط + الأيام السابقة (30 يوماً)
// الأيام المستقبلية ممنوعة نهائياً حتى لا يُسجَّل حضور بالخطأ ليوم لم يحضر أحد فيه.
function buildAttendanceDateOptions() {
  const today = staffSession.todayDate;
  const opts = [];
  const base = new Date(today + "T00:00:00");

  for (let i = 0; i < 30; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() - i);
    const value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const dow = ARABIC_DOW_FULL[d.getDay()];
    const isWeekend = d.getDay() === 5 || d.getDay() === 6;

    let label = `${dow} ${d.getDate()} ${ARABIC_MONTHS[d.getMonth()]}`;
    if (i === 0) label = "اليوم — " + label;
    else if (i === 1) label = "أمس — " + label;
    if (isWeekend) label += " (عطلة أسبوعية)";

    const holiday = (getHolidaysList() || []).find(h => String(h.Date).trim() === value);
    if (holiday) label += " (" + (holiday.Holiday_Name || "عطلة رسمية") + ")";

    opts.push(`<option value="${value}" ${value === attendanceDate ? "selected" : ""}>${label}</option>`);
  }
  return opts.join("");
}

function setAttendanceDraft(studentId, status) {
  attendanceDraft[studentId] = status;
  renderDashboard();
}

async function submitAttendance() {
  const btn = document.getElementById("saveAttendanceBtn");
  btn.disabled = true;
  btn.textContent = "جارِ الحفظ...";

  const records = Object.keys(attendanceDraft).map(sid => ({ Student_ID: sid, Status: attendanceDraft[sid] }));

  const payload = {
    action: "setAttendanceBulk",
    username: staffSession.username,
    password: staffSession._password,
    Date: attendanceDate,
    records: records
  };

  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      attendanceMsg = `<div class="form-msg ok">تم حفظ حضور ${data.updated + data.created} طالب ✓</div>`;
      records.forEach(rec => {
        const idx = (staffSession.attendance || []).findIndex(
          a => String(a.Student_ID) === rec.Student_ID && String(a.Date) === attendanceDate
        );
        if (idx !== -1) staffSession.attendance[idx].Status = rec.Status;
        else staffSession.attendance.push({ Student_ID: rec.Student_ID, Date: attendanceDate, Status: rec.Status });
      });
    } else {
      attendanceMsg = `<div class="form-msg err">${data.error}</div>`;
    }
  } catch (err) {
    attendanceMsg = `<div class="form-msg err">تعذر الاتصال بالخادم</div>`;
  }
  renderDashboard();
}

// لوحة التحكم التحليلية (المدير فقط) — نظرة عامة على كامل المدرسة
// ---------------------------------------------------------------------------

function buildDonutSVG(percent, color, trackColor, centerBig, centerSmall) {
  const r = 42, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - pct / 100);
  return `
    <svg viewBox="0 0 100 100" width="108" height="108">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${trackColor}" stroke-width="11"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="11"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"
        transform="rotate(-90 50 50)"/>
      <text x="50" y="47" text-anchor="middle" font-size="19" font-weight="800" fill="#2C2C2A">${centerBig}</text>
      <text x="50" y="63" text-anchor="middle" font-size="8.5" fill="#A98080">${centerSmall}</text>
    </svg>
  `;
}

function renderAdminDashboardTab() {
  const allStudents = staffSession.students || [];
  const activeStudents = allStudents.filter(s => String(s.Status || "Active").trim() !== "Inactive");
  const parents = staffSession.parents || [];
  const teachers = (staffSession.teachers || []).filter(t =>
    String(t.Role || "").trim() !== "Admin" && String(t.Status || "Active").trim() !== "Inactive");
  const supervisors = (staffSession.supervisors || []).filter(s => String(s.Status || "Active").trim() !== "Inactive");

  // --- المالية: نأخذ آخر Total_Required وآخر Remaining_Balance مسجّلين لكل والد (وليس مجموع كل الصفوف) ---
  const activePayments = (staffSession.payments || []).filter(p => String(p.Status || "Active").trim() !== "Void");
  const lastByParent = {};
  activePayments.forEach(p => { lastByParent[String(p.Parent_ID).trim()] = p; }); // الأحدث يطغى (ترتيب الشيت زمني)
  let totalRequired = 0, totalRemaining = 0;
  Object.values(lastByParent).forEach(p => {
    totalRequired += parseMoney(p.Total_Required);
    totalRemaining += parseMoney(p.Remaining_Balance);
  });
  const totalCollected = Math.max(0, totalRequired - totalRemaining);
  const collectedPct = totalRequired > 0 ? (totalCollected / totalRequired) * 100 : 0;

  // --- توزيع الطلاب حسب الصف والشعبة ---
  const classData = {};
  CLASS_LEVELS_LIST.forEach(c => { classData[c] = { total: 0, sections: {} }; });
  activeStudents.forEach(s => {
    const cl = String(s.Class_Level || "").trim();
    const sec = String(s.Section || "").trim() || "بدون شعبة";
    if (!classData[cl]) classData[cl] = { total: 0, sections: {} };
    classData[cl].total++;
    classData[cl].sections[sec] = (classData[cl].sections[sec] || 0) + 1;
  });

  const classLevelsToShow = CLASS_LEVELS_LIST.filter(c => classData[c] && classData[c].total > 0);
  const otherClasses = Object.keys(classData).filter(c => CLASS_LEVELS_LIST.indexOf(c) === -1 && classData[c].total > 0);
  const allClassKeys = classLevelsToShow.concat(otherClasses);

  const maxClassTotal = Math.max(1, ...allClassKeys.map(c => classData[c].total));
  const maxSectionCount = Math.max(1, ...allClassKeys.flatMap(c => Object.values(classData[c].sections)));
  const totalActiveSections = allClassKeys.reduce((sum, c) => sum + Object.keys(classData[c].sections).length, 0);

  // نسبة الحضور اليوم (تقريبية من سجلات اليوم إن وُجدت)
  const todayAtt = (staffSession.attendance || []).filter(a => String(a.Date).trim() === staffSession.todayDate);
  const presentToday = todayAtt.filter(a => String(a.Status).trim() === "حاضر").length;
  const attendancePct = todayAtt.length > 0 ? (presentToday / todayAtt.length) * 100 : null;

  // ---------------- البناء ----------------

  const statCards = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon">🎓</div><div class="stat-number">${activeStudents.length}</div><div class="stat-label">طالب نشط</div></div>
      <div class="stat-card"><div class="stat-icon">👪</div><div class="stat-number">${parents.length}</div><div class="stat-label">ولي أمر</div></div>
      <div class="stat-card"><div class="stat-icon">👨‍🏫</div><div class="stat-number">${teachers.length}</div><div class="stat-label">معلم نشط</div></div>
      <div class="stat-card"><div class="stat-icon">🚌</div><div class="stat-number">${supervisors.length}</div><div class="stat-label">مشرف/ة باص</div></div>
      <div class="stat-card"><div class="stat-icon">🏫</div><div class="stat-number">${allClassKeys.length}</div><div class="stat-label">مرحلة صفية فعّالة</div></div>
      <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-number">${totalActiveSections}</div><div class="stat-label">شعبة فعّالة</div></div>
    </div>
  `;

  const donuts = `
    <div class="donut-row">
      <div class="donut-box">
        ${buildDonutSVG(collectedPct, "#2E7D5B", "#E1F5EE", "$" + Math.round(totalCollected).toLocaleString(), "من $" + Math.round(totalRequired).toLocaleString())}
        <div class="donut-caption">نسبة التحصيل المالي</div>
      </div>
      ${attendancePct !== null ? `
      <div class="donut-box">
        ${buildDonutSVG(attendancePct, "#A63A3A", "#FBEDE9", Math.round(attendancePct) + "%", presentToday + " من " + todayAtt.length)}
        <div class="donut-caption">نسبة حضور اليوم</div>
      </div>` : ""}
    </div>
  `;

  // الرسم البياني الإجمالي: عدد الطلاب لكل مرحلة صفية
  let overviewChart = `<div class="form-card"><div class="section-title">📊 توزيع الطلاب حسب المرحلة الصفية</div>`;
  allClassKeys.forEach(c => {
    const count = classData[c].total;
    const pct = (count / maxClassTotal) * 100;
    overviewChart += `
      <div class="cbc-row">
        <span class="cbc-label">${c}</span>
        <div class="cbc-track"><div class="cbc-fill" style="width:${pct}%;"></div></div>
        <span class="cbc-count">${count}</span>
      </div>
    `;
  });
  overviewChart += `</div>`;

  // بطاقة تفصيلية لكل صف: عدد الشعب + عدد الطلاب بكل شعبة
  let classCards = `<div class="section-title">🏫 تفاصيل كل مرحلة صفية</div>`;
  allClassKeys.forEach(c => {
    const info = classData[c];
    const sectionNames = Object.keys(info.sections).sort();
    classCards += `
      <div class="class-summary-card">
        <div class="class-summary-head">
          <div class="class-summary-title">${c}</div>
          <span class="badge-role">${info.total} طالب · ${sectionNames.length} شعبة</span>
        </div>
    `;
    sectionNames.forEach(sec => {
      const cnt = info.sections[sec];
      const pct = (cnt / maxSectionCount) * 100;
      const label = sec === "بدون شعبة" ? sec : "شعبة " + sec;
      classCards += `
        <div class="sec-bar-row">
          <span class="sec-bar-label">${label}</span>
          <div class="sec-bar-track"><div class="sec-bar-fill" style="width:${pct}%;"></div></div>
          <span class="sec-bar-count">${cnt}</span>
        </div>
      `;
    });
    classCards += `</div>`;
  });

  if (allClassKeys.length === 0) {
    classCards += `<div class="empty-box">لا يوجد طلاب نشطون مسجّلون بعد</div>`;
  }

  return statCards + donuts + overviewChart + classCards;
}


function renderDashboard() {
  const activeId = document.activeElement ? document.activeElement.id : null;
  const app = document.getElementById("app");

  // حفظ مواضع التمرير قبل إعادة الرسم حتى لا ترتد القوائم لأولها
  const prevScroll = {
    page: window.scrollY,
    groups: (document.getElementById("groupTabsBar") || {}).scrollLeft || 0,
    subs: (document.getElementById("subTabsBar") || {}).scrollLeft || 0,
    teacher: (document.getElementById("teacherTabsBar") || {}).scrollLeft || 0
  };

  let contentHtml = "";
  if (staffSession.role === "Admin") {
    contentHtml = renderAdminTabBars();
    const renderer = ADMIN_TAB_RENDERERS[adminTab];
    contentHtml += renderer ? renderer() : `<div class="empty-box">اختر قسماً</div>`;
  } else {
    contentHtml = `
      <div class="admin-tabs" id="teacherTabsBar">
        <button class="admin-tab-btn ${teacherTab === "roster" ? "active" : ""}" onclick="teacherTab='roster';renderDashboard();">طلابي</button>
        <button class="admin-tab-btn ${teacherTab === "attendance" ? "active" : ""}" onclick="teacherTab='attendance';renderDashboard();">تسجيل الحضور</button>
        <button class="admin-tab-btn ${teacherTab === "attendanceSearch" ? "active" : ""}" onclick="teacherTab='attendanceSearch';renderDashboard();">سجل الحضور</button>
        <button class="admin-tab-btn ${teacherTab === "behavior" ? "active" : ""}" onclick="teacherTab='behavior';renderDashboard();">السلوك</button>
        <button class="admin-tab-btn ${teacherTab === "grades" ? "active" : ""}" onclick="teacherTab='grades';renderDashboard();">العلامات</button>
        <button class="admin-tab-btn ${teacherTab === "assignments" ? "active" : ""}" onclick="teacherTab='assignments';renderDashboard();">الواجبات</button>
      </div>
    `;
    if (teacherTab === "roster") contentHtml += renderTeacherRosterTab();
    else if (teacherTab === "attendance") contentHtml += renderTeacherAttendanceTab();
    else if (teacherTab === "attendanceSearch") contentHtml += renderAttendanceSearchTab();
    else if (teacherTab === "behavior") contentHtml += renderTeacherBehaviorTab();
    else if (teacherTab === "grades") contentHtml += renderTeacherGradesTab();
    else if (teacherTab === "assignments") contentHtml += renderTeacherAssignmentsTab();
  }

  app.innerHTML = `
    <div class="header">
      <div>
        <div style="color:#fff;font-size:15px;font-weight:600;">${staffSession.name || staffSession.username}</div>
        <div style="color:#F3D3D0;font-size:12px;">
          <span class="badge-role">${staffSession.role === "Admin" ? "مدير" : "معلم"}</span>
          ${staffSession.role === "Teacher" ? " · " + staffSession.classLevel + (staffSession.section ? " - شعبة " + staffSession.section : "") : ""}
        </div>
        <div id="liveClock" style="color:#F3D3D0;font-size:11px;margin-top:4px;">${getCurrentDateTimeText()}</div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button id="refreshBtn" class="logout-btn">🔄 تحديث</button>
        <button id="logoutBtn" class="logout-btn">خروج</button>
      </div>
    </div>
    <div class="content">${contentHtml}</div>
  `;

  document.getElementById("refreshBtn").addEventListener("click", async function () {
    const btn = this;
    const oldHtml = btn.innerHTML;
    btn.innerHTML = "⏳...";
    btn.disabled = true;
    try {
      const url = `${API_URL}?action=staffLogin&username=${encodeURIComponent(staffSession.username)}&password=${encodeURIComponent(staffSession._password)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.ok) {
        data._password = staffSession._password;
        staffSession = data;
        renderDashboard(); 
      } else {
        alert("فشل التحديث: " + data.error);
        btn.innerHTML = oldHtml;
        btn.disabled = false;
      }
    } catch (err) {
      alert("تعذر الاتصال بالخادم");
      btn.innerHTML = oldHtml;
      btn.disabled = false;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    staffSession = null;
    adminTab = "students";
    teacherTab = "roster";
    attendanceDraft = {};
    editingStudentId = null;
    editingTeacherUser = null;
    ctxClass = "";
    ctxSection = "";
    selectedPaymentParentId = "";
    attSearchTerm = "";
    attSelectedStudentId = "";
    adminGradeSearchTerm = "";
    adminGradeSelectedStudentId = "";
    renderLogin();
  });

  const addForm = document.getElementById("addStudentForm");
  if (addForm) addForm.addEventListener("submit", submitAddStudent);

  const addParentForm = document.getElementById("addParentForm");
  if (addParentForm) addParentForm.addEventListener("submit", submitAddParent);

  const editStudentForm = document.getElementById("editStudentForm");
  if (editStudentForm) editStudentForm.addEventListener("submit", submitEditStudent);

  const addPaymentForm = document.getElementById("addPaymentForm");
  if (addPaymentForm) addPaymentForm.addEventListener("submit", submitAddPayment);

  const addTeacherForm = document.getElementById("addTeacherForm");
  if (addTeacherForm) addTeacherForm.addEventListener("submit", submitAddTeacher);

  const editTeacherForm = document.getElementById("editTeacherForm");
  if (editTeacherForm) editTeacherForm.addEventListener("submit", submitEditTeacher);

  const addSupervisorForm = document.getElementById("addSupervisorForm");
  if (addSupervisorForm) addSupervisorForm.addEventListener("submit", submitAddSupervisor);

  const behaviorForm = document.getElementById("behaviorForm");
  if (behaviorForm) behaviorForm.addEventListener("submit", submitBehaviorNote);

  const gradeForm = document.getElementById("gradeForm");
  if (gradeForm) gradeForm.addEventListener("submit", submitGrade);

  const assignmentForm = document.getElementById("assignmentForm");
  if (assignmentForm) assignmentForm.addEventListener("submit", submitAssignment);

  const addTAForm = document.getElementById("addTAForm");
  if (addTAForm) addTAForm.addEventListener("submit", submitAddTeacherAssignment);

  const addAnnForm = document.getElementById("addAnnForm");
  if (addAnnForm) addAnnForm.addEventListener("submit", submitAddAnnouncement);

  const addExamForm = document.getElementById("addExamForm");
  if (addExamForm) addExamForm.addEventListener("submit", submitAddExam);

  const addHolidayForm = document.getElementById("addHolidayForm");
  if (addHolidayForm) addHolidayForm.addEventListener("submit", submitAddHoliday);

  // استعادة مواضع التمرير: الشريط يبقى مكانه والصفحة ما ترجع لفوق
  const restoreBar = (id, val) => {
    const bar = document.getElementById(id);
    if (bar && val) bar.scrollLeft = val;
  };
  restoreBar("groupTabsBar", prevScroll.groups);
  restoreBar("subTabsBar", prevScroll.subs);
  restoreBar("teacherTabsBar", prevScroll.teacher);
  if (prevScroll.page) window.scrollTo(0, prevScroll.page);

  // إبقاء التبويب المفتوح ظاهراً داخل الشريط
  const activeTabBtn = document.querySelector(".group-tab-btn.active, .sub-tab-btn.active, .admin-tab-btn.active");
  if (activeTabBtn && activeTabBtn.scrollIntoView) {
    activeTabBtn.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      const val = el.value;
      el.value = "";
      el.value = val;
    }
  }

  // تفعيل الساعة المباشرة بعد الرسم
  startLiveClock();
}

renderLogin();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
